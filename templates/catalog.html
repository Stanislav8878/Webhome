<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Каталог</title>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
</head>
<body>
<div class="d-flex">
  <div class="bg-dark text-white p-3 d-flex flex-column" style="width: 250px; height: 100vh;">
    <h5 class="mb-4">🅱 Меню</h5>
    <ul class="nav flex-column mb-auto">
